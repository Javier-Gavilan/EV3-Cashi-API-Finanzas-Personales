services:
  postgres:
    image: postgres:16
    container_name: cashi-postgres
    restart: always

    environment:
      POSTGRES_USER: cashi_user
      POSTGRES_PASSWORD: cashi_password
      POSTGRES_DB: cashi_db

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: